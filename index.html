<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ball Simulation</title>
    <style>
      canvas {
        background: #f0f0f0;
        display: block;
        margin: auto;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const types = ["A", "B", "D", "G"];
      let balls = [];
      let round = 1;
      let gameRunning = true;

      function spawnBalls() {
        balls = [];
        const typeCount = 18;
        types.forEach((type) => {
          for (let i = 0; i < typeCount; i++) {
            const id = `${type}_${i}`;
            balls.push({
              id,
              type,
              x: Math.random() * 400 + 100,
              y: Math.random() * 400 + 100,
              vx: Math.random() * 4 - 2,
              vy: Math.random() * 4 - 2,
              color: "gray",
              score: 0,
              visitedTypes: new Set([type]),
              cycleDone: false,
              targetId: null,
              group: null,
            });
          }
        });
        assignTargets();
      }

      function assignTargets() {
        balls.forEach((ball) => {
          if (ball.cycleDone) return;
          const others = balls.filter(
            (b) => b.id !== ball.id && !ball.visitedTypes.has(b.type)
          );
          if (others.length > 0) {
            let closest = others[0];
            let minDist = distance(ball, closest);
            for (let b of others) {
              const dist = distance(ball, b);
              if (dist < minDist) {
                minDist = dist;
                closest = b;
              }
            }
            ball.targetId = closest.id;
          } else {
            ball.cycleDone = true;
            ball.vx = 0;
            ball.vy = 0;
            ball.targetId = null;
          }
        });
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function updateBalls() {
        balls.forEach((ball) => {
          if (ball.cycleDone || !ball.targetId) return;

          const target = balls.find((b) => b.id === ball.targetId);
          if (!target) return;

          const dx = target.x - ball.x;
          const dy = target.y - ball.y;
          const dist = Math.hypot(dx, dy);
          const speed = 1.5;

          if (dist < 10) {
            ball.score += 1;
            ball.visitedTypes.add(target.type);
            assignTargets();
          } else {
            ball.vx = (dx / dist) * speed;
            ball.vy = (dy / dist) * speed;
          }

          ball.x += ball.vx;
          ball.y += ball.vy;
        });
      }

      function drawBalls() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        balls.forEach((ball) => {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
          ctx.fillStyle = ball.color;
          ctx.fill();
          ctx.stroke();
        });
      }

      function checkRoundEnd() {
        if (gameRunning && balls.every((b) => b.cycleDone)) {
          gameRunning = false;
          setTimeout(() => {
            if (round === 1) {
              handleEndOfFirstRound();
            } else if (round === 2) {
              handleEndOfSecondRound();
            }
          }, 1000);
        }
      }

      function handleEndOfFirstRound() {
        // Удаление шаров с наименьшим количеством очков
        const minScore = Math.min(...balls.map((b) => b.score));
        balls = balls.filter((b) => b.score > minScore);
        round++;
        resetBallsForNewRound();
        gameRunning = true;
      }

      function handleEndOfSecondRound() {
        groupBallsByScore();
        gameRunning = false;
      }

      function resetBallsForNewRound() {
        balls.forEach((ball) => {
          ball.visitedTypes = new Set([ball.type]);
          ball.cycleDone = false;
          ball.targetId = null;
          ball.vx = Math.random() * 4 - 2;
          ball.vy = Math.random() * 4 - 2;
          ball.group = null;
        });
        assignTargets();
      }

      function groupBallsByScore() {
        balls.forEach((ball) => {
          if (ball.score <= 3) {
            ball.color = "purple";
            ball.group = "low";
          } else if (ball.score === 4) {
            ball.color = "green";
            ball.group = "medium";
          } else if (ball.score <= 6) {
            ball.color = "blue";
            ball.group = "good";
          } else {
            ball.color = "red";
            ball.group = "high";
          }
        });

        const positions = {
          low: { x: 100, y: 100 },
          medium: { x: 700, y: 100 },
          good: { x: 100, y: 500 },
          high: { x: 700, y: 500 },
        };

        const groupCounts = {
          low: 0,
          medium: 0,
          good: 0,
          high: 0,
        };

        balls.forEach((ball) => {
          const group = ball.group;
          const pos = positions[group];
          const index = groupCounts[group];
          const row = Math.floor(index / 10);
          const col = index % 10;

          ball.x = pos.x + col * 15;
          ball.y = pos.y + row * 15;
          ball.vx = 0;
          ball.vy = 0;

          groupCounts[group]++;
        });
      }

      function gameLoop() {
        if (gameRunning) {
          updateBalls();
          checkRoundEnd();
        }
        drawBalls();
        requestAnimationFrame(gameLoop);
      }

      spawnBalls();
      gameLoop();
    </script>
  </body>
</html>
