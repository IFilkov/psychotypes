<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ball Game</title>
    <style>
      canvas {
        background-color: #eee;
        display: block;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let selectionStartTime = Date.now();
      let selectedBalls = [];
      let playerSelectedBalls = [];

      class Ball {
        constructor(x, y, type) {
          this.x = x;
          this.y = y;
          this.radius = 15;
          this.color = this.getColorByType(type);
          this.type = type;
          this.dx = 0;
          this.dy = 0;
          this.score = 0;
          this.id = Math.random().toString(36).substr(2, 9);
          this.hp = 100;
          this.mode = "toCenter"; // варианты: 'toCenter', 'spread'
          this.spreadTimer = 0;
          this.selectedByPlayer = false;
        }

        getColorByType(type) {
          switch (type) {
            case "A":
              return "green";
            case "B":
              return "orange";
            case "D":
              return "purple";
            case "G":
              return "pink";
          }
        }

        /*      draw() {
          if (this.hp <= 0) {
            const width = 30;
            const height = 40;
            const radius = 8;

            // Центрировать прямоугольник
            const x = this.x - width / 2;

            // Нарисовать закруглённый прямоугольник
            ctx.beginPath();

            ctx.lineTo(x, y + radius);

          } else {

            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = "10px Arial";
            ctx.fillText(`${this.score} | ${this.hp}`, this.x - 13, this.y + 3);
            ctx.closePath();
          }
        }*/
        /*
              update() {
                this.x += this.dx;
                this.y += this.dy;
              }*/
        draw() {
          if (this.selectedByPlayer) {
            ctx.fillStyle = "green";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("R", this.x, this.y);
          }
          if (this.hp <= 0) {
            // Рисуем гробик
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.moveTo(this.x - 15, this.y); // верхний левый угол
            ctx.arcTo(this.x + 15, this.y, this.x + 15, this.y + 40, 10); // верхний правый скруглённый угол
            ctx.lineTo(this.x + 15, this.y + 40);
            ctx.lineTo(this.x - 15, this.y + 40);
            ctx.closePath();
            ctx.fill();

            // Надпись RIP
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("RIP", this.x, this.y + 25);
          } else {
            // Рисуем живой шар
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            // проверка на выбор
            ctx.fillStyle = this.selectedByPlayer ? "lightblue" : this.color;
            /* ctx.fillStyle = this.color;*/
            ctx.fill();
            ctx.stroke();

            // Отображаем очки
            ctx.fillStyle = "black";
            ctx.font = "10px Arial";
            ctx.textAlign = "center";
            ctx.fillText(this.score, this.x, this.y + 3);
          }
        }

        update() {
          if (this.hp <= 0) return; // Мёртвый шарик не двигается

          if (this.mode === "toCenter") {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const dx = centerX - this.x;
            const dy = centerY - this.y;
            const dist = Math.hypot(dx, dy);

            const speed = 1.5; // скорость движения к центру

            if (dist > 1) {
              this.dx = (dx / dist) * speed;
              this.dy = (dy / dist) * speed;
              this.x += this.dx;
              this.y += this.dy;
            } else {
              this.dx = 0;
              this.dy = 0;
            }
          } else if (this.mode === "spread") {
            this.x += this.dx;
            this.y += this.dy;

            this.spreadTimer--;
            if (this.spreadTimer <= 0) {
              this.mode = "toCenter";
            }
          }
        }

        moveTo(targetX, targetY, speed = 1.5) {
          const angle = Math.atan2(targetY - this.y, targetX - this.x);
          this.dx = Math.cos(angle) * speed;
          this.dy = Math.sin(angle) * speed;
        }
      }

      const types = ["A", "B", "D", "G"];
      let balls = [];

      function spawnBalls(n = 16) {
        balls = [];
        for (let i = 0; i < n; i++) {
          const type = types[i % types.length];
          let x, y;
          const edge = Math.floor(Math.random() * 4);
          if (edge === 0) {
            x = 0;
            y = Math.random() * canvas.height;
          } else if (edge === 1) {
            x = canvas.width;
            y = Math.random() * canvas.height;
          } else if (edge === 2) {
            x = Math.random() * canvas.width;
            y = 0;
          } else {
            x = Math.random() * canvas.width;
            y = canvas.height;
          }
          const ball = new Ball(x, y, type);
          ball.moveTo(canvas.width / 2, canvas.height / 2);
          balls.push(ball);
        }
      }

      /*     canvas.addEventListener("click", function (e) {
        console.log("click");
        // Ограничение по времени и количеству выбранных шаров
        const currentTime = Date.now();
        if (currentTime - selectionStartTime > 4000) return;
        if (selectedBalls.length >= 4) return;

        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        for (let ball of balls) {
          if (!ball.alive || ball.isSelectedByPlayer) continue;

          const dx = ball.x - clickX;
          const dy = ball.y - clickY;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < ball.radius + 5) {
            ball.isSelectedByPlayer = true;

            console.log(`Вы выбрали шар ${ball.id}`);
            break; // выбираем только один шар за клик
          }
        }
      });*/
      let startTime = Date.now();
      canvas.addEventListener("mousemove", (e) => {
        if (Date.now() - startTime > 4000) return; // Только первые 4 секунды
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        for (const ball of balls) {
          if (ball.hp <= 0 || ball.selectedByPlayer) continue; // Не выбираем мёртвых или уже выбранных
          const dx = mouseX - ball.x;
          const dy = mouseY - ball.y;
          if (Math.sqrt(dx * dx + dy * dy) < ball.radius) {
            if (selectedBalls.length < 4) {
              ball.selectedByPlayer = true;
              selectedBalls.push(ball);
              break;
            }
          }
        }
      });

      function detectCollisions() {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            const dx = b1.x - b2.x;
            const dy = b1.y - b2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < b1.radius + b2.radius) {
              resolveCollision(b1, b2);
            }
          }
        }
      }

      function stopGame() {
        // Например, остановка анимации
        /*cancelAnimationFrame(animationId);*/
        console.log("🎮 Игра остановлена");
      }

      function checkGameState() {
        const aliveBalls = balls.filter((b) => b.hp > 0);

        console.clear(); // очищаем консоль перед новым выводом
        balls.forEach((b) => {
          const status = b.hp > 0 ? "Живой" : "Мертвый";
          console.log(`ID: ${b.id}, Очки: ${b.score}, Статус: ${status}`);
        });

        if (aliveBalls.length === 1) {
          console.log(
            `🏆 Победитель: ID ${aliveBalls[0].id} с ${aliveBalls[0].score} очками!`
          );
          stopGame(); // Остановить игру
        } else if (aliveBalls.length === 0) {
          console.log("☠️ Все погибли. Победителей нет.");
          stopGame(); // Остановить игру
        }
      }

      function resolveCollision(ball1, ball2) {
        if (ball1.hp <= 0 || ball2.hp <= 0) return;

        // Расстояние между центрами
        const dx = ball2.x - ball1.x;
        const dy = ball2.y - ball1.y;
        const distance = Math.hypot(dx, dy);

        if (distance < ball1.radius + ball2.radius) {
          // --- Урон ---
          const damage = Math.floor(Math.random() * 20) + 5; // от 5 до 25
          ball1.hp -= damage;
          ball2.hp -= damage;

          // --- Очки ---
          ball1.score += 1;
          ball2.score += 1;

          // --- Победитель увеличивается ---
          if (ball1.score > ball2.score) {
            ball1.radius += 1;
          } else if (ball2.score > ball1.score) {
            ball2.radius += 1;
          }

          // --- Расчёт направления отталкивания ---
          const angle = Math.atan2(dy, dx);
          const force = 3;

          ball1.dx = -Math.cos(angle) * force;
          ball1.dy = -Math.sin(angle) * force;
          ball2.dx = Math.cos(angle) * force;
          ball2.dy = Math.sin(angle) * force;

          // Установить разбегание
          ball1.mode = "spread";
          ball2.mode = "spread";
          ball1.spreadTimer = 60;
          ball2.spreadTimer = 60;
        }
        checkGameState();
      }

      function regroupToCenter() {
        for (let ball of balls) {
          ball.moveTo(canvas.width / 2, canvas.height / 2);
        }
      }

      let roundActive = true;
      let regroupTimer = 0;

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let ball of balls) {
          ball.update();
          ball.draw();
        }

        if (roundActive) {
          detectCollisions();
          if (balls.length <= 1) {
            roundActive = false;
            regroupTimer = 120;
          }
        } else {
          regroupTimer--;
          if (regroupTimer === 60) regroupToCenter();
          if (regroupTimer <= 0 && balls.length > 1) {
            roundActive = true;
          }
        }

        requestAnimationFrame(gameLoop);
      }

          if (distance < ball.radius + 5) {
            // добавляем допуск
            if (!ball.selectedByPlayer && playerSelectedBalls.length < 4) {
              ball.selectedByPlayer = true;
              playerSelectedBalls.push(ball.id);
              console.log("Выбран шар с ID:", ball.id);
            }
          }
        }
      }*/
      function handleClick(event) {
        console.log("hendle");
        const rect = canvas.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;

        for (const ball of balls) {
          if (ball.hp <= 0 || ball.selectedByPlayer) continue;
          // пропускаем мертвых

          const dx = ball.x - clickX;
          const dy = ball.y - clickY;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < ball.radius + 5) {
            if (!ball.selectedByPlayer && playerSelectedBalls.length < 4) {
              ball.selectedByPlayer = true;

              playerSelectedBalls.push(ball);
              console.log(`Вы выбрали шар игрока: ID ${ball.id}`);
            }
            break;
          }
        }
      }

      spawnBalls();
      gameLoop();
      canvas.addEventListener("mousemove", handleClick);
    </script>
