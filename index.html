        <div class="slider-content">
          <div class="slider" id="slider">

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        font-family: sans-serif;
        background-color: #eee;
      }
      canvas {
        background-color: #eee;
        display: block;
        margin: auto;
      }
      p {
        font-size: xx-large;
      }

      .countdown {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 120px;
        font-weight: bold;
        color: rgba(0, 0, 0, 0.5);
        z-index: 1;
        pointer-events: none;
      }

      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #startBtn,
      #restartBtn {

        font-size: 20px;
        padding: 12px 24px;

        border: none;

        color: white;

        display: flex;
        justify-content: center;

      .modal-slider {

        border-radius: 12px;

        max-height: 90vh;
        padding: 10px;
        position: relative;
        overflow: hidden;

      .slider-content {

        width: 100%;
        overflow: hidden;
        position: relative;
      }

      #slider {
        display: flex;
        transition: transform 0.3s ease;
        width: 100%; /* 4 слайда => 4 x 100% */
      }

      .slide {
        flex: 0 0 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 10px;
      }

      .slide img {
        width: 100%;
        height: auto;
        max-height: 60vh;
        border-radius: 10px;
        object-fit: contain;
      }

      .nav-button {
        position: absolute;
        top: 50%;

        background: rgba(200, 200, 200, 0.8);
        border: none;

        border-radius: 50%;

        cursor: pointer;
        z-index: 1000;
      }

      #prevBtn {
        left: 10px;
      }
      #nextBtn {
        right: 10px;
      }

      .close-button {
        margin-top: 10px;
        background: red;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      .help-button {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: red;
        color: white;
        border-radius: 50%;
        font-size: 24px;
        width: 44px;
        height: 44px;
        border: none;
        cursor: pointer;
        z-index: 1000;
      }
      #startBtn:hover,
      #restartBtn:hover {
        background: #45a049;
      }

      #startBtn {
        pointer-events: auto;
      }

      #endScreen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.95);
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        animation: fadeInZoom 0.6s ease forwards;
        pointer-events: auto;
        z-index: 10;

      #endMessage {
        font-size: 28px;
        margin-bottom: 25px;
        color: #333;
        text-align: center;
      }

        top: 10px;
        right: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #00aaff;
        font-family: sans-serif;
        z-index: 100;
      }

      /* Скрываем при старте */

        display: none;
      }

      @keyframes fadeInZoom {
        from {
          opacity: 0;
          transform: scale(0.5);

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      #introContainer {
        position: absolute;
        top: 20%;
        width: 100%;
        text-align: center;
        z-index: 999;
        pointer-events: none;
      }

      #boomWord {
        font-size: 64px;
        font-weight: bold;
        display: flex;
        justify-content: center;

        animation: slideInBoom 1.5s ease-out forwards;
        transform: translateX(-100%);
      }

        font-size: 48px;

        opacity: 0;

        to {
          transform: translateX(0);
        }
      }

      @keyframes slideInBalls {
        to {
          transform: translateX(0);
          opacity: 1;
        }
      } */
      /* Вход */
      @keyframes slideIn {
        0% {
          transform: translateX(var(--start));
          opacity: 0;
        }
        50% {
          transform: translateX(0);
          opacity: 1;
        }
        70% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      /* Выход */
      @keyframes slideOut {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: translateX(var(--end));
          opacity: 0;
        }
      }

        font-size: 46px;
      }

      #boomWord {
        font-size: 8vw;
      }

      const boomColors = ["green", "orange", "purple", "pink"];

      function startCountdown() {
        let count = 9;
        countdownEl.textContent = count;
        countdownEl.classList.remove("hidden");

        selectionEnabled = true;

        const interval = setInterval(() => {
          count--;
          if (count >= 0) {
            countdownEl.textContent = count;
          }

          if (count < 0) {
            clearInterval(interval);
            countdownEl.textContent = "";
            selectionEnabled = false;

            console.log("⏳ Время выбора команды истекло!");

            // 🔎 Считаем сколько уже выбрал игрок
            const alreadySelected = playerSelectedBalls.length;
            const needed = MAX_SELECTION - alreadySelected;

            if (needed > 0) {
              const unselected = balls.filter(
                (b) => !b.selectedByPlayer && b.hp > 0
              );

              for (let i = 0; i < needed && i < unselected.length; i++) {
                const ball = unselected[i];
                ball.selectedByPlayer = true;
                playerSelectedBalls.push(ball);
                ball.activateAura(); // визуальный эффект
                console.log(`⚙️ Автоматически выбран шар ID: ${ball.id}`);
              }
            }

            console.log(
              "📋 Итог: выбранные шары:",
              playerSelectedBalls.map((b) => b.id)
            );
          }
        }, 1000);
      }

      function animateIntro() {
        // Очистить Boom и подготовить
        boomWord.innerHTML = "";
        boomWord.style.setProperty("--start", "-100vw");
        boomWord.style.setProperty("--end", "100vw");
        boomWord.style.animation = "slideIn 1.5s ease-out forwards";

        // Сгенерировать раскрашенные буквы Boom
        const boomText = "Boom";
        for (let i = 0; i < boomText.length; i++) {

          span.textContent = boomText[i];
          span.style.color =
            boomColors[Math.floor(Math.random() * boomColors.length)];

          boomWord.appendChild(span);
        }

        // Анимация Balls
        ballsWord.style.setProperty("--start", "100vw");
        ballsWord.style.setProperty("--end", "-100vw");
        ballsWord.style.animation = "slideIn 1.5s ease-out 0.3s forwards";

        // Выход через 3 секунды
        setTimeout(() => {
          boomWord.style.animation = "slideOut 1s ease-in forwards";
          ballsWord.style.animation = "slideOut 1s ease-in forwards";
        }, 3000);
      }

      // Запустить цикл анимации до начала игры
      window.addEventListener("DOMContentLoaded", () => {

      });

      const startBtn = document.getElementById("startBtn");
      const endScreen = document.getElementById("endScreen");
      const endMessage = document.getElementById("endMessage");
      const restartBtn = document.getElementById("restartBtn");

      let selectionPhase = false;
      let selectionTimer = 240; // 4 секунды
      let gameStarted = false;
      let winnerBall = null;
      let enemyTeamMode = false;
      let isInitialStart = true;

      startBtn.onclick = () => {
        // clearInterval(introInterval);
        document.getElementById("introContainer").style.display = "none";
        startBtn.style.display = "none";
        helpBtn.style.display = "none";
        // helpBtn.style.display = "none";
        document.getElementById("VersionDisplay").classList.add("hidden");
        isInitialStart = false;
        currentLevel === 1;

      // helpBtn.onclick = () => {

      function updateLevelDisplay() {
        document.getElementById(
          "levelDisplay"
        ).textContent = `Level ${currentLevel}`;
      }

      let selectionStartTime = Date.now();
      let selectedBalls = [];
      let playerSelectedBalls = [];

      class Ball {
        constructor(x, y, type) {
          this.x = x;
          this.y = y;
          this.radius = 15;
          this.baseRadius = 15;
          this.scale = 1;
          this.targetScale = 1;
          this.color = this.getColorByType(type);
          this.type = type;
          this.dx = 0;
          this.dy = 0;
          this.score = 0;
          this.id = Math.random().toString(36).substr(2, 9);
          this.hp = 200;
          this.mode = "toCenter"; // варианты: 'toCenter', 'spread'
          this.spreadTimer = 0;
          this.selectedByPlayer = false;
          this.collisionSurvived = 0;
          this.bonusGiven = false;
          this.auraTimer = 0;
          this.auraColor = null;
          this.isDragging = false;
          this.offsetX = 0;
          this.offsetY = 0;
          this.visualRadius = this.baseRadius + this.score * 2;
        }
        activateAura(duration = 400) {
          this.auraTimer = duration;

          // Можно сразу запустить таймер уменьшения
          const interval = setInterval(() => {
            this.auraTimer -= 100;
            if (this.auraTimer <= 0) {
              this.auraTimer = 0;
              clearInterval(interval);
            }
          }, 100);
        }

        getColorByType(type) {
          switch (type) {
            case "A":
              return "green";
            case "B":
              return "orange";
            case "D":
              return "purple";
            case "G":
              return "pink";
          }
        }

        draw() {
          // 🌟 Если активна аура — рисуем жёлтую окружность
          // if (this.auraTimer > 0) {
          //   ctx.beginPath();
          //   ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
          //   ctx.strokeStyle = "orange";
          //   ctx.lineWidth = 2;
          //   ctx.stroke();
          //   ctx.closePath();
          // }

          if (this.selectedByPlayer) {
            ctx.fillStyle = "green";
            ctx.font = "26px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("💀", this.x, this.y);
          }
          if (this.hp <= 0) {
            // Рисуем гробик
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.moveTo(this.x - 15, this.y); // верхний левый угол
            ctx.arcTo(this.x + 15, this.y, this.x + 15, this.y + 40, 10); // верхний правый скруглённый угол
            ctx.lineTo(this.x + 15, this.y + 40);
            ctx.lineTo(this.x - 15, this.y + 40);
            ctx.closePath();
            ctx.fill();

            // Надпись RIP
            ctx.fillStyle = "white";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("RIP", this.x, this.y + 25);
          } else {
            // Рисуем живой шар
            ctx.save(); // 💡 Сохраняем состояние перед масштабом
            ctx.translate(this.x, this.y);
            this.scale += (this.targetScale - this.scale) * 0.1;
            ctx.scale(this.scale, this.scale);
            ctx.beginPath();
            ctx.arc(0, 0, this.baseRadius, 0, Math.PI * 2); // ⬅️ координаты 0,0
            ctx.fillStyle = this.selectedByPlayer ? "lightblue" : this.color;
            ctx.fill();
            ctx.stroke();
            ctx.restore(); // 💡 Восстанавливаем масштаб и позицию

            if (enemyTeamMode && !this.selectedByPlayer && this.hp > 0) {
              ctx.fillStyle = "purple";
              ctx.font = "12px Arial";
              ctx.textAlign = "center";
              ctx.fillText("Team", this.x, this.y - this.radius - 22);
            }

            // 🌟 Аура: жёлтая или фиолетовая в зависимости от ситуации
            if (this.auraTimer > 0) {
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius + 5, 0, Math.PI * 2);
              ctx.strokeStyle = this.auraColor || "yellow";
              ctx.lineWidth = 2;
              ctx.stroke();
              ctx.closePath();
            }

            // Отображаем очки
            ctx.fillStyle = "black";
            ctx.font = "10px Arial";
            ctx.textAlign = "center";
            ctx.fillText(this.score, this.x, this.y + 3);
          }
          // Отрисовка HP над шариком
          ctx.font = "14px Arial";
          ctx.fillStyle = "black";
          ctx.textAlign = "center";
          ctx.fillText(`❤️${this.hp}`, this.x, this.y - this.radius - 8);
        }

        update() {
          if (this.hp <= 0) return; // Мёртвый шарик не двигается

          balls.forEach((balls) => {
            if (balls.auraTimer > 0) {
              balls.auraTimer--;
            }
          });

          // if (!this.isDragging) {
          //   // Стремится к центру
          //   const centerX = canvas.width / 2;
          //   const centerY = canvas.height / 2;
          //   const dx = centerX - this.x;
          //   const dy = centerY - this.y;
          //   const dist = Math.hypot(dx, dy);
          // }

          if (this.mode === "toCenter") {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const dx = centerX - this.x;
            const dy = centerY - this.y;
            const dist = Math.hypot(dx, dy);

            const speed = 1.5; // скорость движения к центру

            if (dist > 1) {
              this.dx = (dx / dist) * speed;
              this.dy = (dy / dist) * speed;
              this.x += this.dx;
              this.y += this.dy;
            } else {
              this.dx = 0;
              this.dy = 0;
            }
          } else if (this.mode === "spread") {
            this.x += this.dx;
            this.y += this.dy;

            this.spreadTimer--;
            if (this.spreadTimer <= 0) {
              this.mode = "toCenter";
            }
          }
        }

        moveTo(targetX, targetY, speed = 1.5) {
          const angle = Math.atan2(targetY - this.y, targetX - this.x);
          this.dx = Math.cos(angle) * speed;
          this.dy = Math.sin(angle) * speed;
        }
      }

      const types = ["A", "B", "D", "G"];
      let balls = [];

      function spawnBalls(n = baseBallCount) {
        balls = [];
        for (let i = 0; i < n; i++) {
          const type = types[i % types.length];
          let x, y;
          const edge = Math.floor(Math.random() * 4);
          if (edge === 0) {
            x = 0;
            y = Math.random() * canvas.height;
          } else if (edge === 1) {
            x = canvas.width;
            y = Math.random() * canvas.height;
          } else if (edge === 2) {
            x = Math.random() * canvas.width;
            y = 0;
          } else {
            x = Math.random() * canvas.width;
            y = canvas.height;
          }

          const ball = new Ball(x, y, type);

          // Инициализируем таймер ауры
          this.auraTimer = 0;

          if (playerSelectedBallIds.includes(ball.id)) {
            ball.selectedByPlayer = true;
          }

          ball.moveTo(canvas.width / 2, canvas.height / 2);
          balls.push(ball);
        }
      }

      let startTime = Date.now();

      // canvas.addEventListener("click", (e) => {
      //   // if (!selectionEnabled) return; // запрет по таймеру
      //   // if (selectedBalls.length >= MAX_SELECTION) return; // Строго 4 шара
      //   if (!selectionEnabled || selectedBalls.length >= MAX_SELECTION) return;

      //   // handleSelection(e.clientX, e.clientY);

      //   const rect = canvas.getBoundingClientRect();
      //   const mouseX = e.clientX - rect.left;

      //   for (const ball of balls) {

      //     const dy = mouseY - ball.y;
      //     if (Math.sqrt(dx * dx + dy * dy) < ball.radius) {
      //       ball.selectedByPlayer = true;
      //       // selectedBalls.push(ball);
      //       playerSelectedBalls.push(ball);

      //       // Вернём масштаб обратно через 0.6 секунды
      //       setTimeout(() => {
      //         ball.targetScale = 1;
      //       }, 600);
      //       console.log("✅ Выбран шар", ball.id);
      //       break;
      //     }
      //   }
      // });
      canvas.addEventListener("click", (e) => {
        if (!selectionEnabled || playerSelectedBalls.length >= MAX_SELECTION)
          return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;

      function resolveCollision(ball1, ball2) {
        if (ball1.isDragging || ball2.isDragging) return;
        if (ball1.hp <= 0 || ball2.hp <= 0) return;

        const dx = ball2.x - ball1.x;
        const dy = ball2.y - ball1.y;
        const distance = Math.hypot(dx, dy);

        // --- Поведение выбранных шаров (без урона, отталкивание, аура) ---
        if (ball1.selectedByPlayer && ball2.selectedByPlayer) {
          if (distance < ball1.baseRadius + ball2.baseRadius) {
            const angle = Math.atan2(dy, dx);
            const force = 3;

            ball1.dx = -Math.cos(angle) * force;
            ball1.dy = -Math.sin(angle) * force;
            ball2.dx = Math.cos(angle) * force;
            ball2.dy = Math.sin(angle) * force;

            ball1.mode = "spread";
            ball2.mode = "spread";
            ball1.spreadTimer = 60;
            ball2.spreadTimer = 60;

            ball1.hp = Math.min(ball1.hp + 20, 200);
            ball2.hp = Math.min(ball2.hp + 20, 200);

            ball1.activateAura();
            ball2.activateAura();

            console.log(
              `Выбранные шары оттолкнулись и восстановили HP: ${ball1.id}, ${ball2.id}`
            );
          }
          return;
        }

        if (distance < ball1.baseRadius + ball2.baseRadius) {
          // --- EnemyTeam режим ---
          if (!enemyTeamMode) {
            const unselected = balls.filter(
              (b) => !b.selectedByPlayer && b.hp > 0
            );
            const thresholds = [4, 6, 8, 10, 12, 14];
            if (
              currentLevel <= thresholds.length &&
              unselected.length <= thresholds[currentLevel - 1]
            ) {
              enemyTeamMode = true;
              console.log("EnemyTeam");
            }
          }

          // --- Поведение EnemyTeam: исцеление и отталкивание ---
          if (
            enemyTeamMode &&
            !ball1.selectedByPlayer &&
            !ball2.selectedByPlayer
          ) {
            const angle = Math.atan2(dy, dx);
            const force = 3;

            ball1.dx = -Math.cos(angle) * force;
            ball1.dy = -Math.sin(angle) * force;
            ball2.dx = Math.cos(angle) * force;
            ball2.dy = Math.sin(angle) * force;

            ball1.mode = "spread";
            ball2.mode = "spread";
            ball1.spreadTimer = 60;
            ball2.spreadTimer = 60;

            ball1.auraColor = "purple";
            ball2.auraColor = "purple";
            ball1.auraTimer = 240;
            ball2.auraTimer = 240;

            ball1.hp = Math.min(ball1.hp + 40, 200);
            ball2.hp = Math.min(ball2.hp + 40, 200);

            return;
          }

          // --- Отталкивание — происходит всегда ---
          const angle = Math.atan2(dy, dx);
          const force = 3;

          ball1.dx = -Math.cos(angle) * force;
          ball1.dy = -Math.sin(angle) * force;
          ball2.dx = Math.cos(angle) * force;
          ball2.dy = Math.sin(angle) * force;

          ball1.mode = "spread";
          ball2.mode = "spread";
          ball1.spreadTimer = 60;
          ball2.spreadTimer = 60;

          // --- Урон и очки — только после выбора команды ---
          if (!selectionEnabled) {
            const damage = Math.floor(Math.random() * 20) + 5;
            ball1.hp = Math.max(0, ball1.hp - damage);
            ball2.hp = Math.max(0, ball2.hp - damage);

            ball1.collisionSurvived = (ball1.collisionSurvived || 0) + 1;
            ball2.collisionSurvived = (ball2.collisionSurvived || 0) + 1;

            checkSelectedBallSurvival(ball1);
            checkSelectedBallSurvival(ball2);

            ball1.score += 1;
            ball2.score += 1;

            if (ball1.hp <= 0) ball1.hp = 0;
            if (ball2.hp <= 0) ball2.hp = 0;

            if (ball1.score > ball2.score) {
              ball1.baseRadius += 1;
            } else if (ball2.score > ball1.score) {
              ball2.baseRadius += 1;
            }

            // --- Победа/поражение игрока ---
            const aliveBalls = balls.filter((b) => b.hp > 0);
            const onlySelectedAlive = aliveBalls.every(
              (b) => b.selectedByPlayer
            );
            const onlyEnemyTeamAlive = aliveBalls.every(
              (b) => !b.selectedByPlayer && enemyTeamMode
            );
            const anySelectedAlive = aliveBalls.some((b) => b.selectedByPlayer);

            if (!anySelectedAlive && playerSelectedBalls.length > 0) {
              console.log("❌ Все выбранные игроком шары погибли.");
              gameOver("lose");
              return;
            }

            if (onlySelectedAlive && aliveBalls.length > 0) {
              console.log("🎉 Победа игрока! Остались только выбранные шары.");
              gameOver("win");
            } else if (onlyEnemyTeamAlive && aliveBalls.length > 0) {
              console.log("💀 Поражение! Остались только вражеские шары.");
              gameOver("lose");
            }
          }
        }
      }

      function regroupToCenter() {
        for (let ball of balls) {
          ball.moveTo(canvas.width / 2, canvas.height / 2);
        }
      }

      let roundActive = true;
      let regroupTimer = 0;

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let ball of balls) {
          if (this.auraTimer > 0) {
            this.auraTimer--;
          }
          ball.update();
          ball.draw();
        }

        if (!gameStarted) return requestAnimationFrame(gameLoop);

        if (roundActive) {
          detectCollisions();
          if (balls.length <= 1) {
            roundActive = false;
            regroupTimer = 120;
          }
        } else {
          regroupTimer--;
          if (regroupTimer === 60) regroupToCenter();
          if (regroupTimer <= 0 && balls.length > 1) {
            roundActive = true;
          }
        }

        requestAnimationFrame(gameLoop);
      }

      function handleSelection(clientX, clientY) {
        if (!selectionEnabled || selectedBalls.length >= MAX_SELECTION) return;

        // if (!selectionEnabled) return; // запрет по таймеру
        console.log("comon");
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        for (const ball of balls) {
          // if (ball.selectedByPlayer || selectedBalls.length >= MAX_SELECTION)
          //   continue;
          const dx = x - ball.x;
          const dy = y - ball.y;

          if (Math.hypot(dx, dy) < ball.baseRadius * 1.5) {
            ball.selectedByPlayer = true;
            ball.targetScale = 2;
            selectedBalls.push(ball);
            // Вернём масштаб обратно через 0.6 секунды
            setTimeout(() => {
              ball.targetScale = 1;
            }, 600);
            break;
          }
        }
      }

      function handleClick(event) {
        if (!selectionEnabled || selectedBalls.length >= MAX_SELECTION) return;

        // console.log("hendle");
        const rect = canvas.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;

        for (const ball of balls) {
          if (ball.hp <= 0 || ball.selectedByPlayer) continue;
          // пропускаем мертвых
          if (selectedBalls.length >= MAX_SELECTION) return; // ❗ Уже выбрано 4 — дальше не обрабатываем
          const dx = ball.x - clickX;
          const dy = ball.y - clickY;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < ball.baseRadius + 5) {
            if (!ball.selectedByPlayer && playerSelectedBalls.length < 4) {
              ball.selectedByPlayer = true;

              playerSelectedBalls.push(ball);
              console.log(`Вы выбрали шар игрока: ID ${ball.id}`);
            }
            break;
          }
        }
      }
      const helpBtn = document.getElementById("helpBtn");
      const modalOverlay = document.getElementById("modalOverlay");
      const closeBtn = document.getElementById("closeBtn");
      const slider = document.getElementById("slider");
      const slides = slider.querySelectorAll(".slide");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let currentSlide = 0;

      function updateSlider() {
        slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      }

      helpBtn.addEventListener("click", () => {
        helpBtn.classList.add("hidden");
        helpBtn.style.display = "none";
        modalOverlay.classList.remove("hidden");
        updateSlider();
      });

      closeBtn.addEventListener("click", () => {
        modalOverlay.classList.add("hidden");
        helpBtn.style.display = "block";
      });

      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) {
          modalOverlay.classList.remove("hidden");
          helpBtn.style.display = "none";
        }
      });

      prevBtn.addEventListener("click", () => {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        updateSlider();
      });

      nextBtn.addEventListener("click", () => {
        currentSlide = (currentSlide + 1) % slides.length;
        updateSlider();
      });

      // Свайпы для мобильных
      let startX = 0;
      let endX = 0;
      const swipeThreshold = 50;

      slider.addEventListener(
        "touchstart",
        (e) => {
          startX = e.touches[0].clientX;
        },
        { passive: true }
      );

      slider.addEventListener(
        "touchmove",
        (e) => {
          endX = e.touches[0].clientX;
        },
        { passive: true }
      );

      slider.addEventListener("touchend", () => {
        const deltaX = endX - startX;
        if (Math.abs(deltaX) > swipeThreshold) {
          if (deltaX > 0) {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
          } else {
            currentSlide = (currentSlide + 1) % slides.length;
          }
          updateSlider();
        }
        startX = endX = 0;
      });
      // Клик вне слайдера закрывает модалку
      modalOverlay.addEventListener("click", (e) => {
