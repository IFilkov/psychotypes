<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ball Interaction</title>
    <style>
      canvas {
        background: #111;
        display: block;
        margin: 0 auto;
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const types = ["A", "B", "D", "G"];
      const colors = {
        A: "green",
        B: "yellow",
        D: "orange",
        G: "purple",
        red: "red",
        blue: "blue",
      };

      const balls = [];

      class Ball {
        constructor(x, y, type, side) {
          this.x = x;
          this.y = y;
          this.originalType = type;
          this.type = type;
          this.side = side;
          this.color = colors[type];
          this.radius = 10;
          this.speed = 2;
          this.vx = 0;
          this.vy = 0;
          this.target = null;
          this.visitedTypes = new Set([type]);
          this.score = 0;
          this.isFinished = false;
          this.grouping = false;
          this.isGrouped = false;

          this.findTarget();
        }

        findTarget() {
          const candidates = balls.filter(
            (b) =>
              b !== this &&
              b.side !== this.side &&
              b.type === this.type &&
              !b.isFinished &&
              !b.grouping
          );

          if (candidates.length > 0) {
            // можно улучшить — выбирать ближайшую цель
            this.target = candidates[0];
            const dx = this.target.x - this.x;
            const dy = this.target.y - this.y;
            const mag = Math.sqrt(dx * dx + dy * dy);
            this.vx = (dx / mag) * this.speed;
            this.vy = (dy / mag) * this.speed;
          } else {
            this.target = null;
            this.vx = 0;
            this.vy = 0;
          }
        }

        update() {
          if (this.isFinished && !this.grouping) return;

          this.x += this.vx;
          this.y += this.vy;

          // Проверка на столкновение
          if (
            this.target &&
            !this.target.isFinished &&
            !this.target.grouping &&
            this.getDistance(this.target) < this.radius * 2
          ) {
            this.handleCollision(this.target);
          }

          if (this.grouping && !this.isGrouped) {
            const sameColor = balls.find(
              (b) =>
                b !== this &&
                b.color === this.color &&
                b.isFinished &&
                b.grouping &&
                !b.isGrouped
            );

            if (sameColor) {
              const dx = sameColor.x - this.x;
              const dy = sameColor.y - this.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < this.radius * 2) {
                this.vx = 0;
                this.vy = 0;
                this.isGrouped = true;
              }
            }
          }
        }

        handleCollision(other) {
          this.color = this.side === "left" ? "red" : "blue";
          other.color = other.side === "left" ? "red" : "blue";

          this.score++;
          other.score++;

          this.target = null;
          other.target = null;

          this.advanceType();
          other.advanceType();
        }

        advanceType() {
          const remaining = types.filter((t) => !this.visitedTypes.has(t));
          if (remaining.length > 0) {
            this.type = remaining[0];
            this.visitedTypes.add(this.type);
            this.color = colors[this.type];
            this.findTarget();
          } else {
            this.vx = 0;
            this.vy = 0;
            this.isFinished = true;
            this.grouping = true;
            this.groupWithSameColor();
          }
        }

        groupWithSameColor() {
          const buddy = balls.find(
            (b) =>
              b !== this &&
              b.color === this.color &&
              b.grouping &&
              b.isFinished &&
              !b.isGrouped
          );

          if (buddy) {
            const dx = buddy.x - this.x;
            const dy = buddy.y - this.y;
            const mag = Math.sqrt(dx * dx + dy * dy);
            this.vx = (dx / mag) * this.speed;
            this.vy = (dy / mag) * this.speed;
          } else {
            this.vx = 0;
            this.vy = 0;
          }
        }

        getDistance(other) {
          const dx = this.x - other.x;
          const dy = this.y - other.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.stroke();

          ctx.fillStyle = "white";
          ctx.font = "10px Arial";
          ctx.textAlign = "center";
          ctx.fillText(this.type, this.x, this.y + 1);
        }
      }

      // Создание начальных шариков
      function spawnBalls() {
        for (let i = 0; i < 8; i++) {
          const type = types[i % types.length];
          const xLeft = 100 + Math.random() * 50;
          const xRight = 650 + Math.random() * 50;
          const y = 100 + i * 30;

          balls.push(new Ball(xLeft, y, type, "left"));
          balls.push(new Ball(xRight, y, type, "right"));
        }
      }

      // Главный цикл
      function updateAndDraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        balls.forEach((ball) => {
          ball.update();
          ball.draw();
        });

        requestAnimationFrame(updateAndDraw);
      }

      spawnBalls();
      updateAndDraw();
    </script>
  </body>
</html>
