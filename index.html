<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ball Matcher</title>
    <style>
      canvas {
        background: #111;
        display: block;
        margin: 0 auto;
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const types = ["A", "B", "D", "G"];
      const colors = {
        A: "green",
        B: "yellow",
        D: "orange",
        G: "purple",
        red: "red",
        blue: "blue",
      };

      const balls = [];

      class Ball {
        constructor(x, y, type, side) {
          this.x = x;
          this.y = y;
          this.originalType = type;
          this.type = type;
          this.side = side;
          this.color = colors[type];
          this.radius = 10;
          this.speed = 2;
          this.vx = 0;
          this.vy = 0;
          this.target = null;
          this.visitedTypes = new Set([type]);
          this.score = 0;
          this.isFinished = false;
          this.grouping = false;
          this.isGrouped = false;

          this.findTarget();
        }

        findTarget() {
          if (this.isFinished) return;

          const remaining = types.filter((t) => !this.visitedTypes.has(t));
          if (remaining.length === 0) {
            this.finish();
            return;
          }

          this.type = remaining[0];
          this.color = colors[this.type];

          const candidates = balls.filter(
            (b) =>
              b !== this &&
              b.side !== this.side &&
              b.type === this.type &&
              !b.isFinished &&
              !b.grouping
          );

          if (candidates.length > 0) {
            // Ближайший
            candidates.sort(
              (a, b) => this.getDistance(a) - this.getDistance(b)
            );
            this.target = candidates[0];
            const dx = this.target.x - this.x;
            const dy = this.target.y - this.y;
            const mag = Math.sqrt(dx * dx + dy * dy);
            this.vx = (dx / mag) * this.speed;
            this.vy = (dy / mag) * this.speed;
          } else {
            this.target = null;
            this.vx = 0;
            this.vy = 0;
          }
        }

        update() {
          if (this.isFinished && !this.grouping) return;

          this.x += this.vx;
          this.y += this.vy;

          if (
            this.target &&
            !this.target.isFinished &&
            this.getDistance(this.target) < this.radius * 2
          ) {
            this.handleCollision(this.target);
          }

          if (this.grouping && !this.isGrouped) {
            this.groupWithSameColor();
          }
        }

        handleCollision(other) {
          // меняем цвет в зависимости от стороны
          this.color = this.side === "left" ? "red" : "blue";
          other.color = other.side === "left" ? "red" : "blue";

          this.score++;
          other.score++;

          console.log(`💥 Коллизия!`);
          console.log(
            `🔴 ${this.side} [${this.originalType}] → очки: ${this.score}`
          );
          console.log(
            `🔵 ${other.side} [${other.originalType}] → очки: ${other.score}`
          );
          console.log("---");

          this.visitedTypes.add(this.type);
          other.visitedTypes.add(other.type);

          this.target = null;
          other.target = null;

          // this.findTarget();
          other.findTarget();
        }

        finish() {
          this.isFinished = true;
          this.vx = 0;
          this.vy = 0;
          this.grouping = true;
          this.color = this.side === "left" ? "red" : "blue";
        }

        groupWithSameColor() {
          const buddy = balls.find(
            (b) =>
              b !== this &&
              b.color === this.color &&
              b.isFinished &&
              b.grouping &&
              !b.isGrouped
          );

          if (buddy) {
            const dx = buddy.x - this.x;
            const dy = buddy.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < this.radius * 2) {
              this.vx = 0;
              this.vy = 0;
              this.isGrouped = true;
            } else {
              const mag = Math.sqrt(dx * dx + dy * dy);
              this.vx = (dx / mag) * this.speed;
              this.vy = (dy / mag) * this.speed;
            }
          } else {
            this.vx = 0;
            this.vy = 0;
          }
        }

        getDistance(other) {
          const dx = this.x - other.x;
          const dy = this.y - other.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.strokeStyle = "white";
          ctx.stroke();

          ctx.fillStyle = "white";
          ctx.font = "10px Arial";
          ctx.textAlign = "center";
          ctx.fillText(this.type, this.x, this.y + 3);
        }
      }

      // Создание всех шаров
      function spawnBalls() {
        for (let i = 0; i < 8; i++) {
          const type = types[i % types.length];
          const xLeft = 100 + Math.random() * 50;
          const xRight = 650 + Math.random() * 50;
          const y = 100 + i * 30;

          balls.push(new Ball(xLeft, y, type, "left"));
          balls.push(new Ball(xRight, y, type, "right"));
        }
      }

      // Главный цикл
      function updateAndDraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        balls.forEach((ball) => {
          ball.update();
          ball.draw();
        });

        requestAnimationFrame(updateAndDraw);
      }

      spawnBalls();
      balls.forEach((ball) => ball.findTarget());
      updateAndDraw();
    </script>
  </body>
</html>
