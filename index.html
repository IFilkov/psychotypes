<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ball Simulation</title>
    <style>
      canvas {
        background: #f0f0f0;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const types = ["A", "B", "D", "G"];
      let balls = [];
      let idCounter = 0;

      function getBallById(id) {
        return balls.find((ball) => ball.id === id);
      }

      class Ball {
        constructor(x, y, type, id) {
          this.id = id;
          this.x = x;
          this.y = y;
          this.radius = 15;
          this.type = type;
          this.vx = 0;
          this.vy = 0;
          this.color = "gray";
          this.score = 0;
          this.target = null;
          this.collidedTypes = new Set();
          this.finished = false;
        }

        update() {
          if (this.finished) return;

          if (!this.target || this.target.finished || this.target === this) {
            this.findNextTarget();
          }

          if (this.target) {
            const dx = this.target.x - this.x;
            const dy = this.target.y - this.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 1) {
              this.vx = (dx / dist) * 1.5;
              this.vy = (dy / dist) * 1.5;
            }

            this.x += this.vx;
            this.y += this.vy;

            if (dist < this.radius * 2) {
              this.handleCollision(this.target);
            }
          }
        }

        findNextTarget() {
          const candidates = balls.filter(
            (b) => b !== this && !this.collidedTypes.has(b.type) && !b.finished
          );
          if (candidates.length === 0) {
            this.finishCycle();
            return;
          }

          let closest = null;
          let minDist = Infinity;

          for (const b of candidates) {
            const dist = Math.hypot(b.x - this.x, b.y - this.y);
            if (dist < minDist) {
              minDist = dist;
              closest = b;
            }
          }

          this.target = closest;
        }

        handleCollision(other) {
          this.collidedTypes.add(other.type);
          this.score++;

          console.clear();
          console.log("Current Scores:");
          balls.forEach((ball) => {
            console.log(`Ball ${ball.id} (${ball.type}): ${ball.score} points`);
          });

          if (this.collidedTypes.size >= types.length - 1) {
            this.finishCycle();
          }

          this.target = null;
        }

        finishCycle() {
          this.finished = true;
          this.vx = 0;
          this.vy = 0;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "black";
          ctx.font = "10px Arial";
          ctx.fillText(this.type + this.id, this.x - 10, this.y - 20);
          ctx.fillText("S:" + this.score, this.x - 10, this.y + 25);
        }
      }

      function spawnBalls() {
        balls = [];
        idCounter = 0;

        for (let i = 0; i < 8; i++) {
          const x = 300 + Math.random() * 200;
          const y = 200 + Math.random() * 200;
          const type = types[Math.floor(Math.random() * types.length)];
          const ball = new Ball(x, y, type, idCounter++);
          balls.push(ball);
        }
      }

      function updateAndDraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        balls.forEach((ball) => {
          ball.update();
          ball.draw();
        });

        requestAnimationFrame(updateAndDraw);
      }

      // ▶ Старт
      spawnBalls();
      updateAndDraw();
    </script>
  </body>
</html>
