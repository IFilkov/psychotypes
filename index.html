<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ball Simulation</title>
    <style>
      canvas {
        background: #f0f0f0;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      width="800"
      height="600"
      style="border: 1px solid black"
    ></canvas>
    <script>
      class Ball {
        constructor(type, id) {
          this.type = type;
          this.id = id;
          this.radius = 10;
          this.score = Math.floor(Math.random() * 5) + 1;
          this.color = "gray";

          // Рандомное появление с краёв
          const side = Math.floor(Math.random() * 4);
          if (side === 0) {
            // Слева
            this.x = 0;
            this.y = Math.random() * canvas.height;
          } else if (side === 1) {
            // Справа
            this.x = canvas.width;
            this.y = Math.random() * canvas.height;
          } else if (side === 2) {
            // Сверху
            this.x = Math.random() * canvas.width;
            this.y = 0;
          } else {
            // Снизу
            this.x = Math.random() * canvas.width;
            this.y = canvas.height;
          }

          // Движение к центру
          const dx = canvas.width / 2 - this.x;
          const dy = canvas.height / 2 - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          this.vx = (dx / dist) * 2;
          this.vy = (dy / dist) * 2;

          this.target = null;
        }

        move() {
          this.x += this.vx;
          this.y += this.vy;
        }

        draw(ctx) {
          ctx.beginPath();
          ctx.fillStyle = this.color;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        goToTarget() {
          if (!this.target) return;
          const dx = this.target.x - this.x;
          const dy = this.target.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 1) {
            this.vx = (dx / dist) * 2;
            this.vy = (dy / dist) * 2;
          } else {
            this.vx = 0;
            this.vy = 0;
          }
        }
      }

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      let balls = [];

      function spawnBalls(count = 12) {
        const types = ["A", "B", "D", "G"];
        for (let i = 0; i < count; i++) {
          const type = types[i % types.length];
          balls.push(new Ball(type, i));
        }
      }

      function drawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let ball of balls) {
          ball.draw(ctx);
        }
      }

      function updateAll() {
        for (let ball of balls) {
          if (ball.target) {
            ball.goToTarget();
          }
          ball.move();
        }
        checkCollisions();
      }

      function checkCollisions() {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            const dx = b1.x - b2.x;
            const dy = b1.y - b2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < b1.radius + b2.radius) {
              handleComparisonCollision(b1, b2);
            }
          }
        }
      }

      function handleComparisonCollision(ball1, ball2) {
        if (ball1.target !== ball2 || ball2.target !== ball1) return;

        if (ball1.score > ball2.score) {
          ball1.radius += 2; // Увеличиваем радиус победителя
          balls = balls.filter((b) => b !== ball2);
          ball1.target = null;
          assignTargetForWinner(ball1);
        } else if (ball2.score > ball1.score) {
          ball2.radius += 2;
          balls = balls.filter((b) => b !== ball1);
          ball2.target = null;
          assignTargetForWinner(ball2);
        } else {
          balls = balls.filter((b) => b !== ball1 && b !== ball2);
        }

        if (balls.length <= 1) {
          endGame();
        }
      }

      function assignTargetForWinner(ball) {
        if (balls.length <= 1) return;

        let closest = null;
        let minDist = Infinity;

        for (const other of balls) {
          if (other !== ball && !other.target) {
            const dx = ball.x - other.x;
            const dy = ball.y - other.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist) {
              minDist = dist;
              closest = other;
            }
          }
        }

        if (closest) {
          ball.target = closest;
          closest.target = ball;
        }
      }

      function assignInitialComparisonTargets() {
        const unpaired = [...balls];
        while (unpaired.length > 1) {
          const b1 = unpaired.pop();
          let minDist = Infinity;
          let closestIndex = -1;
          for (let i = 0; i < unpaired.length; i++) {
            const b2 = unpaired[i];
            const dx = b1.x - b2.x;
            const dy = b1.y - b2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist) {
              minDist = dist;
              closestIndex = i;
            }
          }
          if (closestIndex !== -1) {
            const b2 = unpaired.splice(closestIndex, 1)[0];
            b1.target = b2;
            b2.target = b1;
          }
        }
      }

      function endGame() {
        console.log("Игра завершена.");
        if (balls.length === 1) {
          console.log(
            "🏆 Победитель:",
            balls[0].id,
            "с",
            balls[0].score,
            "очками"
          );
        } else {
          console.log("Ничья.");
        }
      }

      function gameLoop() {
        updateAll();
        drawAll();
        requestAnimationFrame(gameLoop);
      }

      // === Старт игры ===
      spawnBalls();
      setTimeout(() => {
        assignInitialComparisonTargets();
      }, 2000); // Через 2 секунды после появления — назначим цели
      gameLoop();
    </script>
  </body>
</html>
