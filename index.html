<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Кнопка помощи -->
    <button id="helpBtn" class="help-button">?</button>

    <!-- Модальное окно -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-slider">
        <div class="slider-content">
          <div class="slider" id="slider">
            <!-- Слайды -->
            <div class="slide">
              <img src="/img/file1.webp" alt="Описание 1" />
              <p>Описание 1</p>
            </div>
            <div class="slide">
              <img src="/img/file2.webp" alt="Описание 2" />
              <p>Описание 2</p>
            </div>
            <div class="slide">
              <img src="/img/file3.webp" alt="Описание 3" />
              <p>Описание 3</p>
            </div>
            <div class="slide">
              <img src="/img/file4.webp" alt="Описание 4" />
              <p>Описание 4</p>
            </div>
          </div>
        </div>

        <!-- Навигация -->
        <button id="prevBtn" class="nav-button left">←</button>
        <button id="nextBtn" class="nav-button right">→</button>
        <button id="closeBtn" class="close-button">Скрыть</button>
      </div>
    </div>

    <style>
      /* Общие стили */
      .hidden {
        display: none;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .modal-slider {
        background: white;
        border-radius: 12px;
        max-width: 90%;
        width: 100%;
        max-height: 90vh;
        padding: 10px;
        position: relative;
        overflow: hidden;
        box-sizing: border-box;
      }

      .slider-content {
        overflow: hidden;
        width: 100%;
      }

      .slider {
        display: flex;
        transition: transform 0.4s ease;
        width: 100%; /* 4 слайда */
      }

      .slide {
        flex: 0 0 100%;
        max-width: 100%;
        box-sizing: border-box;
        text-align: center;
      }

      .slide img {
        width: 100%;
        height: auto;
        max-height: 60vh;
        border-radius: 10px;
        object-fit: contain;
      }

      .nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(200, 200, 200, 0.8);
        border: none;
        padding: 10px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 1000;
      }

      .nav-button.left {
        left: 10px;
      }

      .nav-button.right {
        right: 10px;
      }

      .close-button {
        margin-top: 10px;
        background: red;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
      }

      /* Кнопка помощи */
      .help-button {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: red;
        color: white;
        border-radius: 50%;
        font-size: 24px;
        width: 44px;
        height: 44px;
        border: none;
        cursor: pointer;
        z-index: 1000;
      }
    </style>

    <script>
      const helpBtn = document.getElementById("helpBtn");
      const modalOverlay = document.getElementById("modalOverlay");
      const closeBtn = document.getElementById("closeBtn");
      const slider = document.getElementById("slider");
      const slides = slider.querySelectorAll(".slide");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let currentSlide = 0;

      function updateSlider() {
        slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      }

      helpBtn.addEventListener("click", () => {
        modalOverlay.classList.remove("hidden");
        updateSlider();
      });

      closeBtn.addEventListener("click", () => {
        modalOverlay.classList.add("hidden");
      });

      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) {
          modalOverlay.classList.add("hidden");
        }
      });

      prevBtn.addEventListener("click", () => {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        updateSlider();
      });

      nextBtn.addEventListener("click", () => {
        currentSlide = (currentSlide + 1) % slides.length;
        updateSlider();
      });

      // Свайпы для мобильных
      let startX = 0;
      let endX = 0;
      const swipeThreshold = 50;

      slider.addEventListener(
        "touchstart",
        (e) => {
          startX = e.touches[0].clientX;
        },
        { passive: true }
      );

      slider.addEventListener(
        "touchmove",
        (e) => {
          endX = e.touches[0].clientX;
        },
        { passive: true }
      );

      slider.addEventListener("touchend", () => {
        const deltaX = endX - startX;
        if (Math.abs(deltaX) > swipeThreshold) {
          if (deltaX > 0) {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
          } else {
            currentSlide = (currentSlide + 1) % slides.length;
          }
          updateSlider();
        }
        startX = endX = 0;
      });
    </script>
  </body>
</html>
